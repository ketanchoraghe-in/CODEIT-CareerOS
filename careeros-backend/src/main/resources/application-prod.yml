spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  bootstrap:
    admin-email: ${ADMIN_EMAIL}
    admin-password: ${ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cv:
    # Production stores CV files in private AWS S3. Required env:
    # CV_STORAGE=s3, CV_S3_BUCKET, AWS_REGION (or CV_S3_REGION),
    # plus credentials via AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
    # or an IAM role (default provider chain).
    storage: ${CV_STORAGE:s3}
    s3:
      bucket: ${CV_S3_BUCKET}
      region: ${CV_S3_REGION:${AWS_REGION:us-east-1}}
      prefix: ${CV_S3_PREFIX:cvs}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      endpoint: ${CV_S3_ENDPOINT:}

logging:
  level:
    com.codeit.careeros: INFO

# Sprint 8: Swagger/OpenAPI is a development tool — never exposed in
# production (no endpoint inventory, no schemas for attackers).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false